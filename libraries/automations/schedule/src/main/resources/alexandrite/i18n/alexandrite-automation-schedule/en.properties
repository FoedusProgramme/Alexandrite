command.schedule.description=Lists the tasks scheduled in this chat, or cancels one.
usage.schedule=Send /schedule to see the tasks scheduled in this chat, or /schedule cancel <id> to cancel one.
list=Tasks scheduled in this chat:\n{tasks}
list.none=No task is scheduled in this chat.
list.item={id}: {when}, next {next}, set by {user}: {prompt}
list.running=running now
when.once=once
when.every=every {interval}
when.cron=cron {expression} ({zone})
cancel.done=Cancelled task {id}.
cancel.unknown=No task {id} is scheduled in this chat.
unavailable=The schedule cannot be read right now. Try again later.
notice.cut_off=Scheduled task {id} was cut off by a restart or a crash before it finished: {prompt}
notice.missed_once=Scheduled task {id} was due at {due}, while the host was down; it was not run: {prompt}
notice.missed_recurring=Scheduled task {id} missed its run due at {due}, while the host was down: {prompt}
notice.refused=Scheduled task {id}, due at {due}, could not run ({reason}): {prompt}
