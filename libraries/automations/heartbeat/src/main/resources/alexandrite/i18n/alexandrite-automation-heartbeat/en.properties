command.heartbeat.description=Shows the heartbeat of this chat's agent: how often it beats, and when next.
usage.heartbeat=Send /heartbeat without anything after it.
heartbeat.none={agent} has no heartbeat.
heartbeat.shown=Heartbeat of {agent}: every {every}, {hours} ({zone}).
heartbeat.hours_all_day=all day
heartbeat.hours_between=from {start} to {end}
heartbeat.next=Next beat: {time}.
heartbeat.next_none=No beat is due within a week.
heartbeat.no_home={agent} has no home chat, so a beat reaches nobody through "home". An operator makes a chat its home with /home there, or the config sets channels.<instance>.home for the agent.
duration.minutes={minutes} min
duration.hours={hours} h
duration.hours_minutes={hours} h {minutes} min
