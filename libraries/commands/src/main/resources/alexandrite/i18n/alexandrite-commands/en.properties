command.new.description=Starts a new conversation with the agent of this chat.
command.cancel.description=Stops the answer that the chat's agent, or the named one, is giving in this chat.
command.jobs.description=Lists the jobs running in this chat or in every chat, or stops one.
command.compact.description=Folds the older part of the conversation into a summary, so it takes less of the model's context.
command.context.description=Shows how much of the model's context the conversation takes.
command.agent.description=Shows the agents of this chat, or switches to another one.
command.model.description=Shows the model of this chat, lists an endpoint's models, or switches the model.
command.reasoning.description=Shows or sets how much the model reasons.
command.language.description=Shows or sets the language the agent answers in.
command.timezone.description=Shows or sets the time zone the agent tells this chat's times in.
command.home.description=Makes this chat the agent's home chat, or stops it being one.
command.link.description=Shares the conversation of this chat with another chat.
command.unlink.description=Stops sharing the conversation with a linked chat.
command.settings.description=Shows the settings of this chat.
command.mode.description=Shows or sets which tool calls run without asking.
command.trust.description=Lists what is trusted, or trusts a folder, the output of some calls or a person.
command.untrust.description=Stops trusting a folder, the output of some calls or a person.
command.untaint.description=Clears the taint of this chat's conversations, of one agent's here, or of an agent's heartbeat conversation.
command.allow.description=Lists the tool calls that run without asking, or revokes a rule that allows some.
command.profiles.description=Lists the profiles a delegating agent may run as a sub-agent.
command.help.description=Lists the commands you may run in this chat.
command.usage.description=Shows the tokens and money the agent used in this chat and in all, and its budgets.
usage.new=Send /new without anything after it.
usage.cancel=Send /cancel to stop the answer running in this chat, or /cancel <id> to stop that agent's.
usage.jobs=Send /jobs to see the jobs running in this chat, /jobs all for those of every chat, or /jobs stop <id> to stop one.
usage.compact=Send /compact to fold the older part of the conversation into its summary, or /compact <focus> to name what the summary should keep in view.
usage.context=Send /context without anything after it.
usage.agent=Send /agent to see the agents, /agent <id> to switch to one, or /agent reset to go back to the default.
usage.model=Send /model to see the model, /model <number> to pick one of the agent's models, /model <endpoint> to list an endpoint's models, /model <endpoint>/<model> to switch, or /model reset to go back to the agent's.
usage.reasoning=Send /reasoning to see the effort, /reasoning <effort> to set it, or /reasoning reset to go back to the default.
usage.language=Send /language to see the language, /language <tag> (such as en or zh-CN) to set it, or /language reset to go back to the default.
usage.timezone=Send /timezone to see the time zone, /timezone <zone> (such as Asia/Shanghai, Europe/Berlin or +08:00) to set it, or /timezone reset to go back to the default.
usage.home=Send /home to make this chat the agent's home chat, /home off to stop it being one, or /home reset to go back to the configured home chat.
usage.unlink=Send /unlink to take this chat out of its linked chats, or /unlink <chat> to take another chat out of them.
usage.settings=Send /settings without anything after it.
usage.mode=Send /mode to see the permission mode, /mode <mode> to set it, /mode bypass <duration> (such as 30m, 2h or 1d) for a bypass that ends then, or /mode reset to go back to the default.
usage.trust=Send /trust to see what is trusted, /trust <folder> with the folder's absolute path to trust it, /trust <rule>, such as /trust command.exec(git), so that the output of the calls it covers no longer taints this conversation, or /trust in reply to someone's message, or naming them with @, so that their own messages no longer taint.
usage.untrust=Send /untrust <folder> with the folder's absolute path, or /untrust <rule> as /trust wrote it, to stop trusting it, or /untrust in reply to someone's message, or naming them with @, to stop trusting them.
usage.untaint=Send /untaint to clear the taint of every agent's conversation in this chat, /untaint <agent> for one agent's, or /untaint heartbeat [<agent>] for the heartbeat conversation of this chat's agent or of the one named.
usage.allow=Send /allow to see the allow rules in force here, or /allow revoke <number> to revoke one.
usage.profiles=Send /profiles without anything after it.
usage.help=Send /help without anything after it.
usage.usage=Send /usage to see the agent's usage, or /usage all to see that of every agent too.
