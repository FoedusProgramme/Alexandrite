command.new.description=Starts a new conversation with the agent of this chat.
command.cancel.description=Stops the answers and the jobs that are running in this chat.
command.jobs.description=Lists the jobs running in this chat, or stops one.
command.compact.description=Folds the older part of the conversation into a summary, so it takes less of the model's context.
command.context.description=Shows how much of the model's context the conversation takes.
command.agent.description=Shows the agents of this chat, or switches to another one.
command.model.description=Shows the model of this chat, lists an endpoint's models, or switches the model.
command.reasoning.description=Shows or sets how much the model reasons.
command.language.description=Shows or sets the language the agent answers in.
command.home.description=Makes this chat the agent's home chat, or stops it being one.
command.link.description=Shares the conversation of this chat with another chat.
command.unlink.description=Stops sharing the conversation with a linked chat.
command.settings.description=Shows the settings of this chat.
command.mode.description=Shows or sets which tool calls run without asking.
command.trust.description=Lists the trusted folders, or trusts a folder.
command.untrust.description=Stops trusting a folder.
command.allow.description=Lists the tool calls that run without asking, or revokes a rule that allows some.
usage.new=Send /new without anything after it.
usage.cancel=Send /cancel without anything after it.
usage.jobs=Send /jobs to see the jobs running in this chat, or /jobs stop <id> to stop one.
usage.compact=Send /compact to fold the older part of the conversation into its summary, or /compact <focus> to name what the summary should keep in view.
usage.context=Send /context without anything after it.
usage.agent=Send /agent to see the agents, /agent <id> to switch to one, or /agent reset to go back to the default.
usage.model=Send /model to see the model, /model <endpoint> to list an endpoint's models, /model <endpoint>/<model> to switch, or /model reset to go back to the agent's.
usage.reasoning=Send /reasoning to see the effort, /reasoning <effort> to set it, or /reasoning reset to go back to the default.
usage.language=Send /language to see the language, /language <tag> (such as en or zh-CN) to set it, or /language reset to go back to the default.
usage.home=Send /home to make this chat the agent's home chat, /home off to stop it being one, or /home reset to go back to the configured home chat.
usage.unlink=Send /unlink to take this chat out of its linked chats, or /unlink <chat> to take another chat out of them.
usage.settings=Send /settings without anything after it.
usage.mode=Send /mode to see the permission mode, /mode <mode> to set it, /mode bypass <duration> (such as 30m, 2h or 1d) for a bypass that ends then, or /mode reset to go back to the default.
usage.trust=Send /trust to see the trusted folders, or /trust <folder> with the folder's absolute path to trust it.
usage.untrust=Send /untrust <folder> with the folder's absolute path to stop trusting it.
usage.allow=Send /allow to see the allow rules in force here, or /allow revoke <number> to revoke one.
