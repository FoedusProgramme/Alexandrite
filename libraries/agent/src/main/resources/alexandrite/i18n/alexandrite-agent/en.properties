notice.hook_aborted=This message was stopped by a plugin.
notice.blank_reply=The model gave no answer. Try again, or put the message another way.
notice.refused=The model declined to answer this message.
notice.context_window=This conversation no longer fits into the model's context window. Start a new conversation with /new.
notice.output_limit=The answer was cut off where it reached the model's output limit.
notice.output_limit_unanswered=The model reached its output limit before it wrote an answer.
notice.reply_too_long=The answer is too long to send here. It is kept in the conversation.
notice.round_limit=The model used up the tool rounds of this message, so the answer may be incomplete.
notice.failed=Something went wrong while answering this message.
notice.interrupted=The agent stopped before it finished answering this message.
notice.untrusted_folder={agent} is working in {folder}, which has project instructions ({files}) that were not loaded. An admin can trust the folder with /trust {folder}; they load the next time the agent touches it.
notice.unknown_command=There is no command /{command}.
notice.command_failed=The command /{command} failed.
notice.model.unknown=The model {model} is not available, so this message was not answered.
notice.model.authentication=The model provider did not accept the configured credentials. An operator needs to check them.
notice.model.permission_denied=The model provider refused access to the model.
notice.model.quota_exhausted=The quota or credit at the model provider is used up.
notice.model.unavailable=The model cannot be reached right now. Try again later.
notice.model.content_filtered=The model provider's content filter blocked this message or its answer.
notice.model.unsupported=The model cannot handle this request.
notice.model.failed=The model call failed ({kind}).
control.no_agent=No agent serves {chat}.
control.agent_not_attached=Agent '{agent}' does not serve {instance}.
control.unknown_endpoint=There is no model endpoint '{endpoint}'.
control.unknown_model=Model endpoint '{endpoint}' has no model '{model}'.
control.unknown_reasoning='{effort}' is no reasoning effort: use {efforts}.
control.config_refused=The config file did not take the change ({reason}), so nothing changed.
control.not_a_chat_of={chat} is no chat of {instance}.
control.home_taken={chat} is the home chat of agent '{agent}'.
control.self_link=A chat cannot be linked to itself.
control.linked_already={member} is linked to {anchor} already: unlink it first.
control.anchor_with_members={chat} anchors its group: unlink the other chats first.
control.folder_not_absolute=Give the folder as an absolute path, not {folder}.
control.folder_missing=There is no folder at {folder}.
control.folder_protected={folder} is a protected place ({reason}), so it cannot be trusted.
