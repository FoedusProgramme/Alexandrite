command.mcp.description=Shows the MCP servers and their state, restarts one, or logs in to one.
usage.mcp=Send /mcp to see the MCP servers, /mcp restart <server> to restart one, or /mcp login <server> and /mcp logout <server> in a direct chat with the bot to log in to one and out again.
list=MCP servers:\n{servers}
list.none=No MCP server is configured.
list.item={name}: {state}
list.item_error={name}: {state}; last error: {error}
state.connected=connected, protocol {version}, {tools} tools
state.connecting=connecting
state.down=down
state.needs_login=waiting for a login
state.disabled=disabled
restart.done=Restarting MCP server {name}.
server.unknown=No MCP server {name} is configured.
restart.disabled=MCP server {name} is disabled in the config.
state.wider={state}; needs a login with the scope {scope}
state.failing={state}, {count} server errors in a row
login.hint=To log in to a server, an operator sends /mcp login <server> in a direct chat with the bot.
login.refused_group=Send /mcp login and /mcp logout in a direct chat with the bot: the login link and the address you send back are credentials.
login.not_http=MCP server {name} runs as a command, so it has no login.
login.link=Open this link to log in to MCP server {name}, and approve the access there:\n{url}\n\nWhen the browser runs on the bot's own machine, the login then completes by itself. Otherwise the browser fails to load a page on 127.0.0.1: copy that page's address and send /mcp login {name} <address>. The link works for 10 minutes.
login.link_public=Open this link to log in to MCP server {name}, and approve the access there:\n{url}\n\nThe login then completes by itself. The link works for 10 minutes.
login.done=MCP server {name} is logged in and connects again.
login.failed=The login to MCP server {name} failed: {reason}
logout.done=The login to MCP server {name} is forgotten.
logout.none=MCP server {name} has no login to forget.
