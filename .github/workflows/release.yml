name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "Tag $GITHUB_REF_NAME is no v<major>.<minor>.<patch>[-<pre-release>]." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build :app:distTar :app:distZip -Palexandrite.version=${{ steps.version.outputs.version }} --console=plain

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir release
          cp "app/build/distributions/alexandrite-$VERSION.tar.gz" "app/build/distributions/alexandrite-$VERSION.zip" release/
          cp website/install.sh website/install.ps1 release/
          cd release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=
          case "$VERSION" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes \
            --title "Alexandrite $VERSION" $prerelease

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

  maven-central:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Released in the Central Portal by hand unless the repository variable MAVEN_CENTRAL_RELEASE is true
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          RELEASE: ${{ vars.MAVEN_CENTRAL_RELEASE }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          task=publishToMavenCentral
          if [ "$RELEASE" = true ]; then task=publishAndReleaseToMavenCentral; fi
          ./gradlew "$task" -Palexandrite.version="$version" --no-configuration-cache --console=plain
