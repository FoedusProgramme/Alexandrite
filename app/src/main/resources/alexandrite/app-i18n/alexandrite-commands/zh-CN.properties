command.new.description=和这个聊天的智能体开始新对话。
command.cancel.description=停止这个聊天中正在进行的回答。
command.agent.description=查看这个聊天的智能体，或切换到另一个。
command.model.description=查看这个聊天的模型，列出某个端点的模型，或切换模型。
command.reasoning.description=查看或设置模型的推理强度。
command.language.description=查看或设置智能体回答所用的语言。
command.home.description=把这个聊天设为智能体的主聊天，或取消。
command.link.description=和另一个聊天共享这个聊天的对话。
command.unlink.description=停止和某个关联聊天共享对话。
command.settings.description=查看这个聊天的设置。
command.trust.description=列出受信任的文件夹，或信任一个文件夹。
command.untrust.description=取消信任一个文件夹。
usage.new=发送 /new，后面不要带任何内容。
usage.cancel=发送 /cancel，后面不要带任何内容。
usage.agent=发送 /agent 查看智能体，/agent <id> 切换智能体，/agent reset 恢复默认智能体。
usage.model=发送 /model 查看模型，/model <端点> 列出端点的模型，/model <端点>/<模型> 切换模型，/model reset 恢复智能体的模型。
usage.reasoning=发送 /reasoning 查看推理强度，/reasoning <强度> 设置推理强度，/reasoning reset 恢复默认值。
usage.language=发送 /language 查看语言，/language <标签>（如 en 或 zh-CN）设置语言，/language reset 恢复默认语言。
usage.home=发送 /home 把这个聊天设为智能体的主聊天，/home off 取消。
usage.unlink=发送 /unlink 让这个聊天退出关联，/unlink <聊天> 让另一个聊天退出关联。
usage.settings=发送 /settings，后面不要带任何内容。
usage.trust=发送 /trust 查看受信任的文件夹，/trust <文件夹> 加上文件夹的绝对路径来信任它。
usage.untrust=发送 /untrust <文件夹> 加上文件夹的绝对路径来取消信任。
new.done=已和 {agent} 开始新对话。
new.done_linked=已和 {agent} 开始新对话，关联的聊天也共享这段对话（除这里外还有 {count} 个）。
cancel.done=这个聊天中正在进行的回答已取消。
cancel.none=这个聊天中没有正在进行的回答。
agent.current=这个聊天由 {agent}「{name}」回答：{source}。
agent.choices=这个频道的智能体（用 /agent <id> 切换）：
agent.choice={id}「{name}」：{description}
agent.choice_plain={id}「{name}」
agent.default_mark=（默认）
agent.malformed='{text}' 不是智能体 id。智能体 id 是用连字符连接的小写单词，如 main。
agent.switched=这个聊天现在由 {agent}「{name}」回答。和之前智能体的对话会保留。
agent.reset=这个聊天重新由 {agent} 回答：{source}。
model.current=模型：{model}（{source}）。
model.endpoints=端点：{endpoints}。用 /model <端点> 列出端点的模型，用 /model <端点>/<模型> 切换模型，用 /model reset 恢复智能体的模型。
model.list={endpoint} 的模型：\n{models}
model.list_more=另外还有 {count} 个。
model.list_empty={endpoint} 没有列出任何模型。
model.list_failed=无法列出 {endpoint} 的模型，请稍后再试。
model.current_mark=（使用中）
model.no_endpoint=没有端点 '{endpoint}'。端点：{endpoints}。
model.set=这个聊天现在使用模型 {model}。
model.reset=这个聊天重新使用模型 {model}（{source}）。
reasoning.current=推理强度：{effort}（{source}）。可选：{efforts}。
reasoning.set=这个聊天的推理强度现在是 {effort}。
reasoning.reset=推理强度恢复为 {effort}（{source}）。
reasoning.unknown='{text}' 不是推理强度。可选：{efforts}。
language.current=语言：{language}（{source}）。
language.set=这个聊天的语言现在是 {language}。
language.reset=语言恢复为 {language}（{source}）。
language.malformed='{text}' 不是语言标签，请使用 en 或 zh-CN 这样的标签。
home.set=这个聊天现在是 {agent} 在 {instance} 上的主聊天。
home.cleared=这个聊天不再是 {agent} 的主聊天。
home.not_home=这个聊天不是 {agent} 的主聊天。
link.offer=要和另一个聊天共享 {agent} 在这个聊天中的对话，请管理员在 {minutes} 分钟内在那个聊天里发送 `/link {code}`。
link.current=这个聊天已经和 {chats} 共享这段对话。
link.linked=这个聊天现在和 {anchor} 共享 {agent} 的对话。
link.other_agent=这个聊天现在由 {current} 回答：用 /agent {agent} 切换后才能参与共享的对话。
link.anchor_notice={chat} 现在和这个聊天共享 {agent} 的对话。
link.rejected=这个代码未知、已使用或已过期。剩余尝试次数：{tries}。
link.locked=这个聊天输错代码的次数太多，请 {minutes} 分钟后再试。
link.own_code=这个代码属于这个聊天，请在另一个聊天里发送。
link.malformed=这不是关联代码。代码的格式类似 ABCD-EFGH。
unlink.done={chat} 不再共享 {agent} 的对话。
unlink.not_linked=这个聊天没有共享 {agent} 的任何对话。
unlink.not_in_group={chat} 没有和这个聊天关联。
settings.title={chat} 的设置
settings.agent=智能体：{agent}「{name}」（{source}）
settings.model=模型：{model}（{source}）
settings.reasoning=推理强度：{effort}（{source}）
settings.language=语言：{language}（{source}）
settings.home_here=主聊天：这个聊天是 {agent} 在 {instance} 上的主聊天
settings.home_elsewhere=主聊天：{agent} 在 {instance} 上的主聊天是 {home}
settings.home_none=主聊天：{agent} 在 {instance} 上没有主聊天
settings.linked=关联：和 {chats} 共享 {agent} 的对话（锚点 {anchor}）
settings.not_linked=关联：没有其他聊天共享 {agent} 的对话
settings.admin=你是这里的管理员。
settings.member=你不是这里的管理员。
trust.list=受信任的文件夹（包括其下的文件夹）：\n{folders}
trust.none=没有受信任的文件夹。
trust.relative=请用绝对路径指定文件夹，而不是 {folder}。
trust.done={folder} 已受信任，其下的文件夹也是。
untrust.done={folder} 不再受信任。
untrust.not_trusted={folder} 不是受信任的文件夹。
source.selected=在这里用 /agent 选择
source.home=这里是它的主聊天
source.instance_default={instance} 的默认智能体
source.other=原因：{source}
source.chat=在这个聊天中设置
source.agent=智能体的设置
source.no_model=这个聊天和智能体都没有设置
source.model_default=由模型决定
source.host_default=主机的语言
value.default=默认
value.none=无
list.item=- {item}
