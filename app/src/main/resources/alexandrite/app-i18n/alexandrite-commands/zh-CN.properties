command.new.description=和这个聊天的智能体开始新对话。
command.cancel.description=停止这个聊天中正在进行的回答和后台任务。
command.jobs.description=列出这个聊天中正在运行的后台任务，或停止其中一个。
command.compact.description=把对话中较早的部分折叠成摘要，让它少占模型的上下文。
command.context.description=查看这段对话占用了模型多少上下文。
command.agent.description=查看这个聊天的智能体，或切换到另一个。
command.model.description=查看这个聊天的模型，列出某个端点的模型，或切换模型。
command.reasoning.description=查看或设置模型的推理强度。
command.language.description=查看或设置智能体回答所用的语言。
command.home.description=把这个聊天设为智能体的主聊天，或取消。
command.link.description=和另一个聊天共享这个聊天的对话。
command.unlink.description=停止和某个关联聊天共享对话。
command.settings.description=查看这个聊天的设置。
command.mode.description=查看或设置哪些工具调用无需询问即可运行。
command.trust.description=列出受信任的文件夹，或信任一个文件夹。
command.untrust.description=取消信任一个文件夹。
command.allow.description=列出无需询问即可运行的工具调用，或撤销允许它们的规则。
command.profiles.description=列出智能体可以作为子智能体运行的画像。
command.help.description=列出你在这个聊天中可以使用的命令。
usage.new=发送 /new，后面不要带任何内容。
usage.cancel=发送 /cancel，后面不要带任何内容。
usage.jobs=发送 /jobs 查看这个聊天中正在运行的后台任务，或 /jobs stop <id> 停止其中一个。
usage.compact=发送 /compact 把对话中较早的部分折叠进摘要，或发送 /compact <重点> 指明摘要要保留的内容。
usage.context=发送 /context，后面不要带任何内容。
usage.agent=发送 /agent 查看智能体，/agent <id> 切换智能体，/agent reset 恢复默认智能体。
usage.model=发送 /model 查看模型，/model <端点> 列出端点的模型，/model <端点>/<模型> 切换模型，/model reset 恢复智能体的模型。
usage.reasoning=发送 /reasoning 查看推理强度，/reasoning <强度> 设置推理强度，/reasoning reset 恢复默认值。
usage.language=发送 /language 查看语言，/language <标签>（如 en 或 zh-CN）设置语言，/language reset 恢复默认语言。
usage.home=发送 /home 把这个聊天设为智能体的主聊天，/home off 取消，/home reset 恢复为配置里的主聊天。
usage.unlink=发送 /unlink 让这个聊天退出关联，/unlink <聊天> 让另一个聊天退出关联。
usage.settings=发送 /settings，后面不要带任何内容。
usage.mode=发送 /mode 查看权限模式，/mode <模式> 设置权限模式，/mode bypass <时长>（如 30m、2h 或 1d）设置到期结束的绕过模式，/mode reset 恢复默认值。
usage.trust=发送 /trust 查看受信任的文件夹，/trust <文件夹> 加上文件夹的绝对路径来信任它。
usage.untrust=发送 /untrust <文件夹> 加上文件夹的绝对路径来取消信任。
usage.allow=发送 /allow 查看这里生效的允许规则，或 /allow revoke <编号> 撤销其中一条。
usage.profiles=发送 /profiles，后面不要带任何内容。
usage.help=发送 /help，后面不要带任何内容。
new.done=已和 {agent} 开始新对话。
new.done_linked=已和 {agent} 开始新对话，关联的聊天也共享这段对话（除这里外还有 {count} 个）。
