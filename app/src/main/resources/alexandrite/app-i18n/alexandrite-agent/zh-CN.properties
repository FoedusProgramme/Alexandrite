notice.hook_aborted=这条消息被插件拦下了。
notice.blank_reply=模型没有给出回答。请重试，或换个说法。
notice.refused=模型拒绝回答这条消息。
notice.context_window=这段对话已超出模型的上下文窗口，请用 /new 开始新对话。
notice.output_limit=回答达到模型的输出上限，后面的内容被截断了。
notice.output_limit_unanswered=模型还没写出回答就达到了输出上限。
notice.reply_too_long=回答太长，无法在这里发送，已保存在对话中。
notice.round_limit=模型用完了这条消息的工具轮次，回答可能不完整。
notice.failed=回答这条消息时出错了。
notice.interrupted=智能体还没回答完这条消息就停止了运行。
notice.untrusted_folder={agent} 正在 {folder} 中工作，那里的项目指令（{files}）没有加载。管理员可以用 /trust {folder} 信任这个文件夹，智能体下次访问它时就会加载。
notice.untrusted_folders={agent} 正在一些文件夹中工作，它们的项目指令没有加载：{folders}。管理员可以用 /trust <文件夹> 信任其中的文件夹，智能体下次访问它时就会加载。
notice.untrusted_folders_more={agent} 正在一些文件夹中工作，它们的项目指令没有加载：{folders}，另外还有 {count} 个。管理员可以用 /trust <文件夹> 信任其中的文件夹，智能体下次访问它时就会加载。
notice.unknown_command=没有 /{command} 这个命令。
notice.command_failed=命令 /{command} 执行失败。
notice.model.unknown=模型 {model} 不可用，这条消息没有得到回答。
notice.model.authentication=模型服务商不接受所配置的凭据，需要管理员检查。
notice.model.permission_denied=模型服务商拒绝访问该模型。
notice.model.quota_exhausted=模型服务商的额度或余额已用完。
notice.model.unavailable=暂时无法连接模型，请稍后再试。
notice.model.content_filtered=模型服务商的内容过滤拦下了这条消息或它的回答。
notice.model.unsupported=模型无法处理这个请求。
notice.model.failed=模型调用失败（{kind}）。
control.no_agent=没有智能体服务 {chat}。
control.agent_not_attached=智能体 '{agent}' 不服务 {instance}。
control.unknown_endpoint=没有模型端点 '{endpoint}'。
control.unknown_model=模型端点 '{endpoint}' 没有模型 '{model}'。
control.unknown_reasoning='{effort}' 不是推理强度，可用：{efforts}。
control.home_taken={chat} 是智能体 '{agent}' 的主聊天。
control.self_link=聊天不能和自己关联。
control.linked_already={member} 已经关联到 {anchor}，请先取消关联。
control.anchor_with_members={chat} 是它所在关联组的锚点，请先取消其他聊天的关联。
control.link_declared={chat} 所在的关联组由配置文件声明，请编辑配置文件来更改这个关联组。
control.folder_not_absolute=请用绝对路径指定文件夹，而不是 {folder}。
control.folder_missing={folder} 处没有文件夹。
control.folder_protected={folder} 是受保护的位置（{reason}），不能被信任。
