command.heartbeat.description=查看这个聊天的智能体的心跳：多久跳一次，下一次在什么时候。
usage.heartbeat=发送 /heartbeat，后面不要加任何内容。
heartbeat.none={agent} 没有心跳。
heartbeat.shown={agent} 的心跳：每 {every} 一次，{hours}（{zone}）。
heartbeat.hours_all_day=全天
heartbeat.hours_between=从 {start} 到 {end}
heartbeat.next=下一次心跳：{time}。
heartbeat.next_none=一周内没有要到的心跳。
heartbeat.no_home={agent} 没有主聊天，所以心跳发往 "home" 的消息没有人能收到。操作员可以在某个聊天里发送 /home 把它设为主聊天，或者在配置里为这个智能体设置 channels.<instance>.home。
duration.minutes={minutes} 分钟
duration.hours={hours} 小时
duration.hours_minutes={hours} 小时 {minutes} 分钟
