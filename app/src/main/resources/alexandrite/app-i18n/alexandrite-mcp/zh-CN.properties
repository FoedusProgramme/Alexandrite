command.mcp.description=查看 MCP 服务器及其状态，重启其中一个，或登录其中一个。
usage.mcp=发送 /mcp 查看 MCP 服务器，发送 /mcp restart <server> 重启一个服务器，或在与机器人的私聊中发送 /mcp login <server> 和 /mcp logout <server> 登录或退出一个服务器。
list=MCP 服务器：\n{servers}
list.none=没有配置任何 MCP 服务器。
list.item={name}：{state}
list.item_error={name}：{state}；上次错误：{error}
state.connected=已连接，协议 {version}，{tools} 个工具
state.connecting=正在连接
state.down=不可用
state.needs_login=等待登录
state.disabled=已停用
restart.done=正在重启 MCP 服务器 {name}。
server.unknown=没有配置名为 {name} 的 MCP 服务器。
restart.disabled=MCP 服务器 {name} 在配置中已停用。
state.wider={state}；需要以更大的权限范围 {scope} 重新登录
state.failing={state}，连续 {count} 次服务器错误
login.hint=要登录服务器，请操作员在与机器人的私聊中发送 /mcp login <server>。
login.refused_group=请在与机器人的私聊中发送 /mcp login 和 /mcp logout：登录链接和你发回的地址都是凭据。
login.not_http=MCP 服务器 {name} 以命令方式运行，无需登录。
login.link=打开此链接登录 MCP 服务器 {name}，并在页面上批准访问：\n{url}\n\n如果浏览器就在机器人所在的机器上，登录会自动完成。否则浏览器会无法打开 127.0.0.1 上的页面：请复制该页面的地址，然后发送 /mcp login {name} <地址>。链接 10 分钟内有效。
login.link_public=打开此链接登录 MCP 服务器 {name}，并在页面上批准访问：\n{url}\n\n之后登录会自动完成。链接 10 分钟内有效。
login.done=MCP 服务器 {name} 已登录，正在重新连接。
login.failed=登录 MCP 服务器 {name} 失败：{reason}
logout.done=已忘记 MCP 服务器 {name} 的登录。
logout.none=MCP 服务器 {name} 没有可忘记的登录。
