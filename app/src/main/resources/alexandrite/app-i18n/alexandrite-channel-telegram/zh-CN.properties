pairing.code=这个聊天还没有与本机器人配对。如需配对，请把配对码 {code} 交给机器人的运营者，它在 {minutes} 分钟内有效。
refused.admin=只有本机器人的管理员可以使用 /{command}。
refused.admin_here=在这个聊天里，只有本机器人的管理员可以使用 /{command}。
refused.queue_full=这里等待回答的消息太多了（最多 {capacity} 条），这条消息没有被接收。请稍后再发。
refused.no_agent=没有智能体回答这个聊天，需要机器人的运营者为它配置一个。
unsupported.message=本机器人只读取文字和图片说明，所以没有接收这条消息。
shutdown.unfinished=机器人还没回答这条消息就停止了运行。等机器人恢复后请再发一次。
