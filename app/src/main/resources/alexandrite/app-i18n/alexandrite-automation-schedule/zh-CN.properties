command.schedule.description=列出这个聊天中的定时任务，或取消其中一个。
usage.schedule=发送 /schedule 查看这个聊天中的定时任务，或发送 /schedule cancel <id> 取消一个任务。
list=这个聊天中的定时任务：\n{tasks}
list.none=这个聊天中没有定时任务。
list.item={id}：{when}，下次 {next}，由 {user} 设置：{prompt}
list.running=正在运行
when.once=一次
when.every=每 {interval}
when.cron=cron {expression}（{zone}）
cancel.done=已取消任务 {id}。
cancel.unknown=这个聊天中没有任务 {id}。
refused.admin=只有管理员可以取消定时任务。
unavailable=暂时无法读取定时任务，请稍后再试。
notice.cut_off=定时任务 {id} 在完成前因重启或崩溃而中断：{prompt}
notice.missed_once=定时任务 {id} 原定于 {due} 运行，但当时主机未运行，任务没有执行：{prompt}
notice.missed_recurring=定时任务 {id} 错过了原定于 {due} 的一次运行（当时主机未运行）：{prompt}
notice.refused=定时任务 {id}（原定于 {due}）无法运行（{reason}）：{prompt}
